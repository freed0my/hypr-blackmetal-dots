# Minimal, clean, functional config made by Archebus.
# Laptop Version

#############
### INPUT ###
#############

input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =
    accel_profile = flat
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

device {
    name = "opentabletdriver-virtual-artist-tablet"
    output = "DP-1"
}


#############################
#           VARS
#############################

# Color Variables
$background = 0xFF1A1A1A
$surface = 0xFF252525
$surface_alt = 0xFF2D2D2D
$text = 0xFFE0E0E0
$text_secondary = 0xFFA0A0A0
$text_dim = 0xFF707070
$highlight = 0xFFF6F7EB

#############################
#         CONFIG
#############################

# Minimal Config
general {
    border_size = 2
    gaps_out = 10
    col.inactive_border = $surface_alt
    col.active_border = $highlight
    col.nogroup_border = $surface
    resize_on_border = true
}

# Just disabling blur
decoration {
    rounding = 4
    # Use a minimal wallpaper with transparent term.
    blur {
        enabled = false
    }
}

animations {
  enabled = yes
  animation = fade, 1, 2, default
}

# Turning off some hyprland silliness.
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    mouse_move_enables_dpms = true
    middle_click_paste = false
    key_press_enables_dpms = true
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    enable_swallow = true
    swallow_regex = ^(kitty)$
}

# No popups please.
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

#############################
#       ENVIRONMENT
#############################

$menu = rofi -show drun
$terminal = kitty
$screenshot = hyprshot -m region -m active --clipboard-only

# Monitor Setup
monitor=DP-1,1920x1080@240,0x0,1
monitor=HDMI-A-1,1920x1080@60,-1920x0,1

workspace = 1,monitor:DP-1
workspace = 2,monitor:DP-1
workspace = 3,monitor:DP-1
workspace = 4,monitor:DP-1
workspace = 5,monitor:DP-1
workspace = 6,monitor:HDMI-A-1
workspace = 7,monitor:HDMI-A-1
workspace = 8,monitor:HDMI-A-1
workspace = 9,monitor:HDMI-A-1
workspace = 10,monitor:HDMI-A-1

# Cursor Setup.
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24

# Initial Startup
# pass the Wayland environment to systemd/dbus — otherwise xdg-desktop-portal-hyprland crashes on login
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = waybar &
exec-once = dunst &
exec-once = awww-daemon
exec-once = sleep 1 && awww img ~/.config/hypr/black.jpg
exec-once = wl-paste --watch cliphist store
exec-once = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"
exec-once = gsettings set org.gnome.desktop.interface gtk-theme "Adwaita-dark"
exec-once = gsettings set org.gtk.Settings.FileChooser sort-directories-first true
exec-once = gsettings set org.gnome.desktop.wm.preferences theme "Adwaita-dark"
exec-once = hyprsunset
exec-once = otd-daemon

#############################
#          BINDS
#############################

# Keybindings
$mainMod = SUPER

# Standard binds
bind = $mainMod, Return, exec, kitty
bind = $mainMod SHIFT, Return, exec, kitty --class="kitty-window"
bind = $mainMod, C, killactive,
bind = alt, F, fullscreen
bind = $mainMod, Space, togglefloating,
bind = $mainMod, D, exec, wofi -show
bind = $mainMod SHIFT, P, pseudo, # dwindle
bind = $mainMod SHIFT, L, exec, swaylock
bind = $mainMod, P, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, Print, exec, grim - | wl-copy
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/wall.sh --same
bind = $mainMod SHIFT, K, exec, hyprctl dispatch exit
bind = $mainMod, E, exec, thunar
bind = alt, X, exec, $menu
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, v, exec, hyprshot -m region --clipboard-only
bind = $mainMod, L, exec, hyprlock

# Move focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces

# Move windows to workspaces
bind = alt, 1, workspace, 1
bind = alt, 2, workspace, 2
bind = alt, 3, workspace, 3
bind = alt, 4, workspace, 4
bind = alt, 5, workspace, 5
bind = $mainMod, 1, workspace, 6
bind = $mainMod, 2, workspace, 7
bind = $mainMod, 3, workspace, 8
bind = $mainMod, 4, workspace, 9
bind = $mainMod, 5, workspace, 10
bind = $mainMod+shift, 1, movetoworkspace, 1
bind = $mainMod+shift, 2, movetoworkspace, 2
bind = $mainMod+shift, 3, movetoworkspace, 3
bind = $mainMod+shift, 4, movetoworkspace, 4
bind = $mainMod+shift, 5, movetoworkspace, 5
bind = ctrl+shift, 1, movetoworkspace, 6
bind = ctrl+shift, 2, movetoworkspace, 7
bind = ctrl+shift, 3, movetoworkspace, 8
bind = ctrl+shift, 4, movetoworkspace, 9
bind = ctrl+shift, 5, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Special window movement keys
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Window resizing
bind = $mainMod CTRL, left, resizeactive, -20 0
bind = $mainMod CTRL, right, resizeactive, 20 0
bind = $mainMod CTRL, up, resizeactive, 0 -20
bind = $mainMod CTRL, down, resizeactive, 0 20

# Special workspace handling
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

device {
    name = opentabletdriver-virtual-artist-tablet
    output = DP-1
}

