# Blackmetal — hyprlock styled after the SDDM theme /usr/share/sddm/themes/blackmetal
# Palette: bg #080708 · surface #211D21 · frame #2D2D2D · text #C4C0C4
#          textSec #8C858C · textDim #3A353A · accent #E0DCE0 · highlight #F6F7EB · crit #A8324D
# Coordinates assume 1920x1080 (same as Main.qml). y > 0 is up.
# hyprlock font_size is in pt (≈ px × 0.75), so 14px from SDDM → 11.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    immediate_render = true
}

animations {
    enabled = false
}

background {
    monitor =
    path = ~/.config/hypr/black.jpg
    color = rgb(000000)
    blur_passes = 0
}

# ═══ top bar (islands like in waybar), center y = 540-10-17 = 513 ═══

# ── logo ──
shape {
    monitor =
    size = 42, 34
    color = rgba(00000000)
    rounding = 4
    border_size = 2
    border_color = rgb(2D2D2D)
    position = -929, 513
    halign = center
    valign = center
}
label {
    monitor =
    text = 
    color = rgb(E0DCE0)
    font_size = 13
    font_family = $font
    position = -929, 513
    halign = center
    valign = center
}

# ── hostname ──
shape {
    monitor =
    size = 104, 34
    color = rgba(00000000)
    rounding = 4
    border_size = 2
    border_color = rgb(2D2D2D)
    position = -850, 513
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:0] cat /etc/hostname
    color = rgb(8C858C)
    font_size = 11
    font_family = $font
    position = -850, 513
    halign = center
    valign = center
}

# ── clock ──
shape {
    monitor =
    size = 182, 34
    color = rgba(00000000)
    rounding = 4
    border_size = 2
    border_color = rgb(2D2D2D)
    position = 0, 513
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:1000] LC_TIME=C date +"%a %d %b  %H:%M"
    color = rgb(E0DCE0)
    font_size = 11
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 513
    halign = center
    valign = center
}

# ── layout ──
shape {
    monitor =
    size = 46, 34
    color = rgba(00000000)
    rounding = 4
    border_size = 2
    border_color = rgb(2D2D2D)
    position = 797, 513
    halign = center
    valign = center
}
label {
    monitor =
    text = $LAYOUT[us,ru]
    color = rgb(8C858C)
    font_size = 11
    font_family = $font
    position = 797, 513
    halign = center
    valign = center
}

# ── session ──
shape {
    monitor =
    size = 124, 34
    color = rgba(00000000)
    rounding = 4
    border_size = 2
    border_color = rgb(2D2D2D)
    position = 888, 513
    halign = center
    valign = center
}
label {
    monitor =
    text = <span foreground="##8C858C"></span>  Hyprland
    color = rgb(C4C0C4)
    font_size = 11
    font_family = $font
    position = 888, 513
    halign = center
    valign = center
}

# ═══ login window (like rofi): 416x106, highlight border — "active window" ═══
shape {
    monitor =
    size = 416, 106
    color = rgb(080708)
    rounding = 4
    border_size = 2
    border_color = rgb(F6F7EB)
    position = 0, 0
    halign = center
    valign = center
}

# ── user row (y = +21) ──
label {
    monitor =
    text = 
    color = rgb(3A353A)
    font_size = 11
    font_family = $font
    position = 776, 21
    halign = left
    valign = center
    zindex = 2
}
label {
    monitor =
    text = $USER
    color = rgb(E0DCE0)
    font_size = 11
    font_family = $font
    position = 802, 21
    halign = left
    valign = center
    zindex = 2
}

# ── password row (y = -21): surface highlight, like focus in SDDM ──
shape {
    monitor =
    size = 388, 36
    color = rgb(211D21)
    rounding = 2
    border_size = 0
    position = 0, -21
    halign = center
    valign = center
    zindex = 1
}
label {
    monitor =
    text = 
    color = rgb(E0DCE0)
    font_size = 11
    font_family = $font
    position = 776, -21
    halign = left
    valign = center
    zindex = 2
}
label {
    monitor =
    text = 
    color = rgb(8C858C)
    font_size = 12
    font_family = $font
    position = 1130, -21
    halign = left
    valign = center
    zindex = 2
}

input-field {
    monitor =
    size = 328, 36
    outline_thickness = 0
    rounding = 2
    inner_color = rgba(00000000)
    outer_color = rgba(00000000)
    check_color = rgba(00000000)
    fail_color = rgba(00000000)
    capslock_color = rgba(00000000)
    font_color = rgb(E0DCE0)
    font_family = $font
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = false
    dots_rounding = -1
    fade_on_empty = false
    placeholder_text = <span foreground="##3A353A">password</span>
    fail_text = <span foreground="##A8324D">wrong password</span>
    hide_input = false
    position = 0, -21
    halign = center
    valign = center
    zindex = 3
}

# ── caps lock below the window ──
label {
    monitor =
    text = cmd[update:250] ~/.config/hypr/scripts/capslock.sh
    color = rgb(A8324D)
    font_size = 10
    font_family = $font
    position = 0, -71
    halign = center
    valign = center
}
